تعليمات بناء وفحص AgonApp 0.3.0
ارفع محتويات AgonApp_Build.zip إلى جذر مستودع GitHub، مع إظهار .github وgradlew وsettings.gradle.kts في الجذر.
شغّل GitHub Actions workflow باسم CI. يجب أن تنجح اختبارات testDebugUnitTest وcore-domain:test وcore-data:test وcore-store:test وlintDebug وassembleDebug وassembleDebugAndroidTest وفحص 16KB.
شغّل workflow باسم Instrumented يدوياً؛ يجب أن ينجح connectedDebugAndroidTest على محاكي API 36.
نزّل APK من artifact app-debug. قد يقدمه GitHub داخل ZIP خاص بالـartifact؛ استخرج APK مرة واحدة، أو استخدم GitHub Release asset عند إعداد إصدار موقّع.
لا تستخدم APK Debug كتحديث فوق نسخة قديمة قبل التأكد من تطابق شهادة التوقيع. لا تحذف النسخة القديمة أو بياناتها لمجرد تجربة APK.
لا توجد مفاتيح إصدار مضمنة. لإعداد توقيع دائم، خزّن KEYSTORE_BASE64 وKEYSTORE_PASSWORD وKEY_ALIAS وKEY_PASSWORD في GitHub Secrets فقط، ولا ترفعها إلى المستودع.
لا تعتبر أي فحص ناجحاً إلا إذا ظهر نجاحه فعلياً في GitHub. راجع REPAIR_AND_VALIDATION_REPORT.md لمعرفة حدود التحقق المنفذ محلياً.
المشروع يستهدف compileSdk 36 وtargetSdk 36 وJDK 17، ويحافظ على applicationId=com.ghaith.trading. لا يدّعي هذا الإصدار تكاملات خارجية لم يثبت وجودها في الشفرة.
