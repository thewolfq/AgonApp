تعليمات التنفيذ الرئيسية — AgonApp / GAITH TRADING
0) المهمة والنتيجة المطلوبة
أنت وكيل هندسة Android مسؤول عن تدقيق هذا المستودع ثم إصلاحه وتطويره وتسليم إصدار قابل للبناء والتثبيت على Android 16 (API 36). لا تكتفِ بتجميل الواجهة أو تعديل الاختبارات لتصبح خضراء. افهم السلوك الحالي، أثبت صحة الحسابات، ثم نفّذ التحسينات المتفق عليها واختبرها فعلياً.
المخرجات الإلزامية:
مشروع Android كامل في ZIP اسمه AgonApp_Build.zip، ومحتوياته في جذر الأرشيف مباشرة (يظهر .github/ وgradlew وsettings.gradle.kts عند فتحه، دون مجلد تغليف إضافي).
سير عمل GitHub Actions يبني ويختبر المشروع تلقائياً، ويصدر APK Debug قابل للتثبيت كتنصيب جديد، وتقارير الاختبار وLint وملف SHA-256.
GitHub Release يرفق APK كأصل تنزيل مباشر .apk (ليس داخل ZIP إضافي) بعد نجاح جميع بوابات الإصدار. لا تدّع أن Artifact العادي تنزيل APK مباشر؛ GitHub Actions artifacts تُنزّل عادةً كأرشيف ZIP.
تقرير تدقيق وإصلاح يوضح ما تغير، وما اختُبر فعلياً، وما بقي غير مختبر. لا تضع PASS لأي اختبار لم يعمل فعلياً.
1) قواعد غير قابلة للتفاوض
حافظ على applicationId = com.ghaith.trading وnamespace الحاليين ما لم يثبت وجود سبب تقني قاطع، ولا تغيّرهما.
لا تحذف محركات الحساب أو البيانات الموجودة قبل فهمها واختبارها.
لا تكسر التوافق مع بيانات المستخدم القديمة. أي تغيير في التخزين يحتاج ترحيل schema/version واختبار ترحيل واسترجاع.
لا تضع أسرار API أو كلمات مرور أو مفاتيح توقيع في المصدر أو ZIP أو السجلات.
لا تنشئ أو تدّعِ امتلاك مفتاح توقيع إصدار غير متوفر. استخدم Debug signing الافتراضي للتجارب/التثبيت الجديد فقط. وضّح أن التحديث فوق تطبيق موقع بمفتاح آخر قد يُرفض. لا تحذف بيانات المستخدم ولا تطلب منه إزالة التطبيق القديم قبل إثبات النسخ الاحتياطي والتوقيع.
لا تضف أوامر تداول حقيقية. التطبيق الحالي Paper Trading؛ أي ميزة تداول حقيقي خارج النطاق وتتطلب موافقة منفصلة وتصميماً أمنياً مستقلاً.
لا تدّعِ أن Binance أو CoinMarketCap أو CoinGecko أو TraderSpy أو أي مزود متصل ما لم توجد واجهة اتصال فعلية واختبار تكامل/حالة اتصال. لا تعرض بيانات تجريبية كأنها مباشرة.
لا تضع بيانات مالية بصيغة Float/Double. استخدم BigDecimal في الحسابات المالية، مع تقريب موثق ومتوافق مع قواعد المنصة ورموزها.
لا تغيّر التصميم كلياً بطريقة تزيل وظائف حالية. حسّن تجربة الاستخدام مع الحفاظ على الهوية العربية RTL وسهولة الاستخدام على شاشة هاتف Android.
2) تدقيق الحالة الحالية قبل التعديل
ابدأ بقراءة كل الملفات وREADME.md وBUILD_MANIFEST.md ونتائج reports (2).zip. الحالة المعروفة عند بدء المهمة:
المشروع المرفق معلن كإصدار 0.2.0 ومرحلة M0 في README/BUILD_MANIFEST.
التقرير المرفق يحتوي 47 اختباراً: 46 ناجحاً واختبار واحد فاشل في PaperEngineTest.unrealizedPnlMatchesDirection (السطر 38). لا تغيّر القيمة المتوقعة فقط لإسكات الاختبار؛ افحص حساب الكمية والمخاطرة والعمولات وفسّر الفرق رياضياً. صحّح إما منطق المجال أو توقع الاختبار إذا كان التوقع خاطئاً، مع توثيق السبب وإضافة اختبارات اتجاه Long وShort والرسوم.
تقرير Lint المتاح في الحزمة يظهر No issues found لوحدة core-store فقط؛ لا تعمم النتيجة على التطبيق كله. أعد تشغيل lint لكل المشروع.
BUILD_MANIFEST.md يذكر بنوداً NOT_RUN. أبقِها NOT_RUN حتى تُشغّل فعلياً.
واجهة التطبيق الحالية تتضمن السوق والحاسبة والصفقات الورقية. لا تفترض وجود محركات تحليل فني متقدمة أو تكاملات خارجية غير موجودة في المصدر.
أنتج أولاً قائمة جرد: الشاشات، النماذج، مصادر البيانات، المؤشرات، الحسابات، التخزين، الاختبارات، نقاط الفشل، والتكاملات الموجودة فعلاً. اربط كل ميزة بملفها واختبارها.
3) متطلبات المنتج وتجربة الاستخدام
صمّم كتطبيق تداول وتحليل مساعد، لا كآلة توصيات مضمونة. الأولوية: الدقة والوضوح والتحذير من عدم اليقين، ثم الجمال.
واجهة عربية
RTL كامل، نصوص عربية صحيحة، لا قص أو تداخل في الشاشات الصغيرة.
تصميم متناسق وحديث: تدرج بصري واضح، مسافات موحدة، بطاقات خفيفة، ألوان ربح/خسارة لا تعتمد على اللون وحده، خطوط مقروءة، حالات تحميل/فراغ/خطأ/انقطاع شبكة.
شاشات أساسية منظمة: السوق، تفاصيل الأصل/التحليل، الحاسبة، الصفقات الورقية، سجل الأداء، الإعدادات/حول التطبيق.
إظهار وقت آخر تحديث ومصدر كل معلومة وحالتها: LIVE / DELAYED / CACHED / ESTIMATED / UNAVAILABLE.
لا تُخفِ التحذيرات، ولا تعرض سعراً مخزناً على أنه حي.
راعِ Android 16، edge-to-edge، التنقل بالإيماءات، أحجام الخطوط وإعدادات الوصول، الوضع الداكن/الفاتح إن أمكن دون تشويه الهوية.
السوق والرسوم
دعم Binance Spot وUSDT-M Futures بتمييز واضح بين السوقين، وعدم خلط الأسعار أو أحجام التداول أو بيانات العقود.
بحث وفرز ومفضلة، حالات انقطاع، إعادة محاولة محدودة، backoff، إلغاء الطلبات القديمة، وعدم السماح لاستجابة أقدم باستبدال بيانات أحدث.
رسوم شموع صحيحة OHLCV مع اختيار إطار زمني، تكبير/تمرير، حجم تداول، خطوط مؤشرات ومستويات مرئية مع مفتاح/Legend وقيم قابلة للقراءة.
لا ترسم خطوط دعم/مقاومة أو إشارات بلا خوارزمية موثقة واختبارات. وضّح هل المستوى آلي/يدوي ومدى قوته وطريقة حسابه.
لا تعتمد على بيانات ticker وحدها لحساب مؤشرات تحتاج تاريخ شموع.
المؤشرات والتحليل
أضف فقط المؤشرات التي يمكن حسابها من بيانات صحيحة وباختبارات مستقلة. عند دعمها، وفّر RSI وMACD وEMA/SMA وATR وBollinger Bands وVWAP وحجم التداول/متوسطه، مع فترة كل مؤشر ومصدر البيانات والإطار الزمني.
اختبر قيم المؤشرات مقابل مجموعات بيانات معروفة أو مرجع مستقل، بما فيها بداية السلسلة والقيم الناقصة والصفرية والبيانات غير المرتبة.
عرّف بوضوح طريقة حساب RSI (Wilder أو غيره)، MACD، EMA، ATR، Bollinger والانحراف المعياري، VWAP.
لا تُصدر BUY/SELL بسبب مؤشر منفرد. افصل الاتجاه، الزخم، التقلب، الحجم، البنية، والسيولة. أظهر أسباب الإشارة والعوامل المعارضة.
كل إشارة لها: الاتجاه، الإطار، منطقة التفعيل، شرط التأكيد، نقطة الإبطال، وقف/أهداف مقترحة إن أمكن، نسبة العائد للمخاطرة بعد الرسوم، درجة ثقة معايرة وليست ضماناً، وقت الإنشاء والانتهاء.
إذا لم تتوفر بيانات كافية أو كانت متأخرة، اعرض NO SIGNAL / INSUFFICIENT DATA بدلاً من اختلاق نتيجة.
الحاسبة وإدارة المخاطر
راجع معادلات الكمية والهامش والرسوم والتمويل والتصفية وPnL المحقق وغير المحقق بدقة.
افصل رسوم الدخول والخروج، maker/taker، funding، tickSize/stepSize/minNotional، leverage brackets، maintenance margin، liquidation fees إن كانت متاحة.
لا تستخدم معدل صيانة ثابتاً لكل الرموز إذا كانت Binance توفر شرائح مختلفة. إذا تعذر جلبها، اعرض ESTIMATED بوضوح.
احسب Reward/Risk من صافي الربح المتوقع بعد الرسوم إلى صافي الخسارة عند الوقف بعد الرسوم، وليس من مسافات الأسعار فقط. ارفض القيم غير المنطقية.
اختبر Long وShort، رسوم الصفر والرسوم الفعلية، الرافعات القصوى، الوقف القريب والبعيد، الكميات الصغيرة، rounding، overflow، والحد الأدنى للكمية.
لا تسمح بفتح صفقة ورقية إن كان السعر قديماً أو غير صالح أو لم تتوفر قواعد الرمز.
أظهر رأس المال، الهامش المستخدم، الهامش المتاح، المخاطرة النقدية والنسبية، أقصى خسارة، الرسوم، سعر التصفية التقريبي وتحذيراته.
التداول الورقي
لا تستخدم كلمة تنفيذ حقيقي. جميع الصفقات محاكاة فقط.
سجل كل عملية مع snapshot لرسوم/قواعد الرمز وقت الفتح حتى لا تتغير حساباتها عند تحديث الإعدادات.
اختبر الإغلاق اليدوي والوقف والهدف والتصفية والانقطاع وإعادة التشغيل والأسعار الجزئية والتكرار ومنع إغلاق الصفقة مرتين.
عند انقطاع السعر لا تستخدم آخر سعر محفوظ كأنه حي؛ اعرضه كـ CACHED. سياسة الإغلاق القسري يجب أن تكون واضحة ولا تختلق fill price.
أضف ملخص أداء: الربح الصافي، win rate، profit factor، drawdown، متوسط الربح/الخسارة، وعدد الصفقات، مع تعريف المعادلات واستبعاد البيانات غير المكتملة.
إعادة ضبط الحساب تتطلب تأكيداً صريحاً وتوضح أنها تمسح بيانات المحاكاة فقط.
4) التكاملات الخارجية
Binance: استخدم واجهات عامة للبيانات أولاً، لا حاجة إلى مفتاح لأسعار السوق العامة. أي بيانات خاصة/حساب مستخدم يجب أن تكون اختيارية، read-only، مشفرة عبر Android Keystore، ولا تطلب صلاحيات التداول أو السحب.
CoinMarketCap وCoinGecko وTraderSpy: لا تفترض وجود مفاتيح أو خطط مجانية أو واجهات متاحة. تحقق من الوثائق الحالية وشروط الاستخدام وحدود الطلبات. صمم طبقة Provider مستقلة، مع مفاتيح اختيارية مخزنة بأمان، caching، rate limiting، timeouts، وإظهار مصدر البيانات. لا تكرر طلبات API بشكل مكلف.
إذا لم توجد بيانات موثوقة أو اعتماد متاح، اترك الموفر غير متصل مع رسالة صريحة، ولا تحاكِ تكاملاً.
Public Equity Investing ليس مزود أسعار تلقائياً؛ لا تربطه كتغذية بيانات إلا عبر تكامل موثق ومتاح ومصرح به.
لا تضع أسراراً في APK أو GitHub Actions logs. استخدم GitHub Secrets للـCI فقط عند الحاجة.
5) الأداء والاتصال
مناسب لهاتف Android 16 متوسط المواصفات واتصال ضعيف/متقطع.
لا تعمل polling بلا توقف بالخلفية. حدّث السوق فقط عند الحاجة، وقلل استهلاك البيانات، واستخدم backoff واحترام حدود API.
استخدم coroutines/structured concurrency، lifecycle-aware collection، إلغاء jobs عند مغادرة الشاشة، وعدم حجب Main Thread.
حافظ على استجابة الواجهة مع قوائم كبيرة ورسوم كثيرة. اختبر استهلاك الذاكرة والتسربات وإعادة التركيب.
لا تطلب صلاحيات غير لازمة. الإنترنت فقط للوظائف الشبكية.
6) التوافق والبناء
استهدف Android 16 / API 36 مع compileSdk=36 وtargetSdk=36 وJDK 17 وGradle/AGP متوافقين ومثبتة الإصدارات.
افحص 16KB page-size alignment لكل مكتبة native ولكل APK عند وجودها.
نفّذ ./gradlew clean test lintDebug assembleDebug assembleDebugAndroidTest، ثم connectedDebugAndroidTest على محاكي API 36. نفّذ release build مع R8 واختبارات smoke إن أمكن.
لا تقل إن التطبيق يعمل على Android 16 لمجرد نجاح compile؛ يجب نجاح تثبيت وتشغيل المحاكي، ثم يظل اختبار الهاتف الحقيقي موصى به.
أضف workflow يكتشف جذر المشروع بشكل حتمي. لا تستخدم build-root-directory مع gradle/actions/setup-gradle@v4 لأنه خيار غير مدعوم. لا تختَر أول gradlew عشوائياً إذا وُجد أكثر من مشروع.
حدّث GitHub Actions إلى إصدارات مدعومة حالياً بعد التحقق من release notes. لا ترفع major versions بلا فحص.
أخرج APK Debug منفصلاً مع SHA-256، وتقارير JUnit XML/HTML وLint ونتائج المحاكي.
أضف workflow إصدار يرفق ملف APK مباشرة كـGitHub Release asset عند توافر توقيع صالح. إذا لم توجد مفاتيح إصدار، لا تدّع أن unsigned APK قابل للتثبيت؛ اشرح ذلك. يمكن توفير Debug APK للتثبيت الجديد بتوقيع Debug الافتراضي، لكن مفتاح Debug المتغير بين runners قد يمنع التحديث فوق نسخة سابقة.
7) التوقيع والتحديث
لا توجد مفاتيح إصدار لدى المستخدم حالياً. لا تنشئ مفتاحاً سرياً وتخزنه في المستودع.
Debug APK يثبت عادةً كتطبيق جديد. التحديث فوق نسخة موجودة يتطلب نفس شهادة التوقيع وapplicationId ورقم إصدار أعلى.
إذا كانت نسخة المستخدم السابقة موقعة بمفتاح لا يملكه، لا يمكن ضمان تحديثها. لا تطلب حذفها قبل إبلاغ المستخدم بخطر فقد البيانات.
وثّق إعداد توقيع دائم اختياري عبر GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. لا تطبعها في logs.
8) الاختبارات الإلزامية
اكتب/حدّث اختبارات لكل طبقة:
Domain: الحسابات المالية والمؤشرات والإشارات.
Data: parsing، ترتيب timestamps، nulls، HTTP errors، rate limits، stale responses.
Store: حفظ/استرجاع، تلف قاعدة البيانات، migrations، crash/restart.
UI: التنقل، RTL، حالات التحميل والخطأ، إدخال الحاسبة، عرض الأسعار القديمة.
Instrumented: تشغيل التطبيق على API 36، تدوير/إعادة إنشاء Activity، الخلفية/المقدمة، فقد الشبكة واستعادتها، حفظ البيانات.
Regression: أعد إنتاج كل bug من التقرير كاختبار يفشل قبل الإصلاح وينجح بعده.
لا تعدّل اختباراً لمجرد جعله أخضر. لكل تغيير في حساب مالي، اكتب شرح المعادلة ومثالاً عددياً مستقلاً، واختبر اتجاهي LONG وSHORT.
9) بوابات التسليم
لا تسلّم على أنه جاهز إلا إذا:
لا توجد أخطاء compile.
كل اختبارات JVM تنجح.
كل اختبارات Android instrumented على API 36 تنجح.
Lint لا يحتوي أخطاء غير معالجة؛ التحذيرات مفسرة.
Debug APK وRelease APK يبنيان حسب حالة التوقيع المعلنة.
فحص 16KB ينجح عند انطباقه.
APK يُثبت ويُفتح على محاكي API 36.
هوية الحزمة ثابتة.
التقارير وSHA-256 موجودة.
لا توجد أسرار أو بيانات شخصية داخل ZIP.
إذا فشل أي شرط، لا تخفِ الفشل ولا ترفع حالة نجاح كاذبة. أصلح وأعد الاختبار. إذا تعذر تشغيل اختبار، اكتب NOT_RUN وسبباً محدداً.
10) التقرير النهائي المطلوب
أرفق AUDIT_AND_RELEASE_REPORT.md ويشمل:
الميزات الموجودة فعلاً مقابل الميزات المضافة.
قائمة الملفات المعدلة وسبب كل تعديل.
المعادلات المالية والمؤشرات ومراجع التحقق.
مصادر البيانات وحالة كل Provider.
نتائج كل اختبار بالأعداد والمدة.
نتائج المحاكي API 36، Lint، 16KB، install/launch.
قيود التوقيع والتحديث.
قائمة المخاطر المتبقية بوضوح.
SHA-256 للـZIP وAPK.
11) أسلوب التنفيذ
نفّذ على مراحل صغيرة مع الحفاظ على build أخضر بعد كل مرحلة: (A) إصلاحات حرجة واختبارات، (B) سلامة البيانات والاتصال، (C) الحاسبة والمخاطر، (D) السوق والرسوم والمؤشرات، (E) الإشارات والتقييم، (F) تحسين UI/UX، (G) تكاملات موثقة، (H) CI ومحاكي وإصدار. لا تنفذ إعادة تصميم شاملة قبل رسم خريطة الشاشات والسلوك الحالي. لا تضف ميزة شكلية على حساب صحة الحسابات أو ثبات البيانات.
