# ضعه في المستودع باسم: .github/workflows/build-apk.yml
# يعمل سواء كان المشروع مفكوكاً في الجذر أو مجلداً فرعياً أو ملف ZIP مرفوعاً كما هو.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          set -euo pipefail
          if ! find . -maxdepth 3 -name gradlew -not -path './.git/*' | grep -q .; then
            Z=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            [ -n "$Z" ] || { echo "::error::No gradlew and no .zip found in repo root"; exit 1; }
            mkdir -p _proj && unzip -q -o "$Z" -d _proj
          fi
          G=$(find . -maxdepth 4 -name gradlew -not -path './.git/*' | head -1)
          DIR=$(dirname "$G")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project dir: $DIR"
          sed -i 's/\r$//' "$G"
          chmod +x "$G"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Tests + Lint + assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --console=plain testDebugUnitTest :core-domain:test :core-data:test lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            ${{ env.PROJECT_DIR }}/**/build/reports/**
            ${{ env.PROJECT_DIR }}/**/build/test-results/**
