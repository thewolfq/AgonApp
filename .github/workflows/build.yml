
name: Build Agon APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgonApp_Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o AgonApp_Build.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/AgonApp wrapper --gradle-version 8.11.1
          chmod +x extracted/AgonApp/gradlew
          extracted/AgonApp/gradlew -p extracted/AgonApp assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AgonApp-APK
          path: extracted/AgonApp/app/build/outputs/apk/debug/*.apk
