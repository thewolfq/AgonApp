
name: Build Agon APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgonApp_Build.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -o AgonApp_Build.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/AgonApp --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AgonApp-APK
          path: extracted/AgonApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
